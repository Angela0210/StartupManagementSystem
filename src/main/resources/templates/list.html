<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Startup List</title>
</head>
<body>

<div>
    <!-- The form below should invoke the method StartupController.listAll -->
    <form id="filter-form" th:action="@{/startups}" th:method="GET">
        <label for="name">Startup Name</label>
        <input id="name" type="text" name="name" th:value="${name}"/>

        <label for="valuation">Valuation (in millions)</label>
        <input id="valuation" type="number" name="valuation" th:value="${valuation}"/>

        <label for="yearFounded">Year Founded</label>
        <input id="yearFounded" type="number" min="2000" name="yearFounded" th:value="${yearFounded}"/>

        <label for="industry">Industry</label>
        <select id="industry" name="industry">
            <option value="">All</option>
            <!-- For each Industry you should have one <option> like below  -->
            <option th:each="lvl : ${industries}"
                    th:value="${lvl}"
                    th:text="${lvl}"
                    th:selected="${industry != null && industry == lvl}">
            </option>
        </select>

        <label for="founderId">Founder</label>
        <select id="founderId" name="founderId">
            <option value="">All</option>
            <!-- For each founder you should have one <option> like below  -->
<!--            <option>[founder.name]</option>-->

            <option th:each="cat : ${founders}"
                    th:value="${cat.getId()}"
                    th:text="${cat.getName()}"
                    th:selected="${founderId != null && founderId == cat.getId()}">
            </option>
        </select>

        <button id="filter" type="submit">Filter</button>
    </form>

    <div>
        <!-- StartupController.showAdd -->
        <a
            th:href ="@{'/startups/add'}"

            sec:authorize="hasRole('ADMIN')"
            class="add-item"
        >Add new startup</a>
    </div>
<!--            href ="@{'/startups/add/{id}' (id=${product.getId()})}"-->
    <table>
        <tr>
            <th>Startup Name</th>
            <th>Valuation</th>
            <th>Year Founded</th>
            <th>Industry</th>
            <th>Founder</th>
            <th>Active/Deactivated</th>
            <th>Actions</th>
        </tr>
        <!-- For each startup you should have one <tr> like below -->
        <tr  th:each="startup : ${page.getContent()}"  class="item">
            <td th:text="${startup.getName()}">[startup.name]</td>
            <td th:text="${startup.getValuation()}">[startup.valuation]</td>
            <td th:text="${startup.getYearFounded()}">[startup.yearFounded]</td>
            <td th:text="${startup.getIndustry()}">[startup.industry]</td>
            <td th:text="${startup.founder.name}">[startup.founder.name]</td>
            <td  th:text="${startup?.active} ? 'ACTIVE' : 'DEACTIVATED'">[startup.active] -> ACTIVE/DEACTIVATED</td>
            <td>
                <!-- StartupController.edit -->
                <a th:href="@{'/startups/edit/{id}' (id=${startup.getId()})}"
                   sec:authorize="hasRole('ADMIN')" class="edit-item">Edit</a>

                <!-- StartupController.delete -->
                <form th:action="@{'/startups/delete/{id}' (id=${startup.getId()})}"
                      sec:authorize="hasRole('ADMIN')"
                      th:method="post"
                >
                    <button type="submit" class="delete-item">Delete</button>
                </form>

                <!-- StartupController.close -->
                <form th:if="${startup.isActive()}" th:action="@{'/startups/deactivate/{id}' (id=${startup.getId()})}"
                      sec:authorize="hasRole('ADMIN')"
                      th:method="post"
            >
                    <button type="submit" class="close-item">Deactivate</button>
                </form>

            </td>
        </tr>
    </table>
</div>

<div>
    <ul id="nav">
        <li><a href="/">Home</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/logout">Logout</a></li>
    </ul>
</div>

</body>
</html>
